# Heap is bounded well below physical RAM on purpose: this machine has no swap,
# so a build that overshoots gets OOM-killed instead of slowing down. Gradle,
# the Kotlin daemon, the Dart analysis server and the IDE all run at once.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# 16 cores would otherwise mean 16 concurrent workers, each holding its own heap.
org.gradle.workers.max=4

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# Flutter still needs legacy AGP DSL; plugins like dynamic_color/file_picker still
# apply KGP, so keep the temporary opt-outs until they fully support AGP 9.
android.builtInKotlin=false
android.newDsl=false

# Silence AGP deprecation noise for those temporary opt-outs / legacy variant API.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

ext {
    defaultMinSdkVersion = 24
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Align Java/Kotlin JVM targets across Flutter plugins (AGP 9 + Kotlin 2.3
// reject mismatches such as file_picker's Java 11 vs Kotlin 1.8).
subprojects { subproject ->
    def alignJvm = {
        if (subproject.plugins.hasPlugin("com.android.library") ||
                subproject.plugins.hasPlugin("com.android.application")) {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }
    }
    if (subproject.state.executed) {
        alignJvm()
    } else {
        subproject.afterEvaluate { alignJvm() }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

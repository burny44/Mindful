pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("android/local.properties")
        localPropertiesFile.withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in android/local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "com.android.application" version "8.13.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

rootProject.name = "Mindful"
include ":app"
project(":app").projectDir = file("android/app")

// flutter-plugin-loader assumes settings.gradle lives in android/, so include
// plugins here with this repo as the Flutter project root.
def pluginsFile = file(".flutter-plugins-dependencies")
if (pluginsFile.exists()) {
    def object = new groovy.json.JsonSlurper().parseText(pluginsFile.text)
    object.plugins.android.each { androidPlugin ->
        def needsBuild = androidPlugin.containsKey("native_build") ? androidPlugin["native_build"] : true
        if (!needsBuild) {
            return
        }
        def pluginDirectory = new File(androidPlugin.path as String, "android")
        assert pluginDirectory.exists(): "Plugin directory does not exist: ${pluginDirectory}"
        include ":${androidPlugin.name}"
        project(":${androidPlugin.name}").projectDir = pluginDirectory
    }
}
